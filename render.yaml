services:
  - type: web
    name: dashboard-acesso
    runtime: node
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: GOOGLE_SHEETS_API_KEY
        sync: false
      - key: CONTROL_SHEET_ID
        sync: false
      - key: CONTROL_SHEET_NAME
        value: Clientes
      - key: CONTROL_SHEET_RANGE
        value: A1:Z300
