[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/clients"
  to   = "/.netlify/functions/sheets-proxy?route=clients"
  status = 200

[[redirects]]
  from = "/api/sheets"
  to   = "/.netlify/functions/sheets-proxy"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
